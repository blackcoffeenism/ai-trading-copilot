services:
  # ==========================================================
  # Standalone AI Analysis Engine (Render Free Web Service)
  # ==========================================================
  - type: web
    name: ai-trading-copilot-engine
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r ai/requirements.txt
    startCommand: python -m uvicorn ai.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: .
