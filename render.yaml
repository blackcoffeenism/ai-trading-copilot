services:
  # ==========================================================
  # 1. FastAPI Backend + AI Service (Render Free Web Service)
  # ==========================================================
  - type: web
    name: ai-trading-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: SUPABASE_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://postgres:postgres@localhost:5432/postgres

  # ==========================================================
  # 2. React / Vite Frontend (Render Free Static Site)
  # ==========================================================
  - type: web
    name: ai-trading-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-trading-backend
          property: host
